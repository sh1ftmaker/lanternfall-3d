<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Wick Line-up</title>
<style>
  :root { --bg: #07060f; --fg: #efe6d6; --muted: #a59c8f; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font: 13px/1.4 system-ui, sans-serif; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; }
  #ui { position: fixed; left: 12px; top: 12px; background: rgba(10, 9, 20, 0.78); padding: 10px 12px; border-radius: 10px; max-width: calc(100vw - 48px); z-index: 2; }
  #ui b { font-weight: 600; } #ui .m { color: var(--muted); } #ui label { margin-right: 10px; white-space: nowrap; }
  .lbl { position: fixed; transform: translate(-50%, 0); font: 600 11px/1.2 system-ui, sans-serif; color: #f5ecdc; text-shadow: 0 1px 4px #000; pointer-events: none; white-space: nowrap; }
</style>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/"}}
</script>
</head>
<body>
<div id="ui"><b>Wick, the lamplighter: animation line-up</b> <span class="m">every clip of the Platformer, looping · drag to orbit</span><br>
  <label>set <select id="set"></select></label>
  <label><input type="checkbox" id="play" checked> play</label>
  <label>u <input type="range" id="u" min="0" max="1" step="0.01" value="0.5"></label>
</div>
<script type="module">
// The Platformer's character alone: rows of clips from fx/platformer/animator.js, each looping through its animation
// (u = 0..1) at the length the movement library uses. '#set=N' picks a set, '#u=0.4' freezes every clip at that point.
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { createCharacter } from './fx/platformer/character.js';
import { createAnimator } from './fx/platformer/animator.js';
import { ID, LEN } from './fx/platformer/anims.js';

const SETS = [
  ['standing', ['idleLook', 'idleLookBack', 'idleTrim', 'lookAround', 'wallLean', 'warmHands', 'shiver', 'pant']],
  ['moving', ['tiptoe', 'walk', 'run', 'skid', 'turnPlant', 'turnPush', 'push', 'sidestepLeft']],
  ['crouch & crawl', ['crouchDown', 'crouch', 'crouchUp', 'crawlStart', 'crawl', 'slideKick', 'seatSlide', 'bellySlide']],
  ['jumps', ['jump', 'land', 'jumpTwoRise', 'jumpTwoFall', 'jumpThree', 'backflip', 'sideFlip', 'longJump']],
  ['air & landings', ['wallTouch', 'wallKick', 'fall', 'dive', 'poundStart', 'pound', 'poundLand', 'landThree']],
  ['lantern pole', ['jab', 'jabBack', 'swing', 'swingBack', 'sweep', 'spinSweep', 'airSwing', 'bellyGetUp']],
  ['ledges & knocks', ['ledgeHang', 'ledgeClimbSlow', 'ledgeClimbFast', 'bonk', 'fallBackHard', 'fallFrontHard', 'knockBack', 'airKnockBack']],
  ['water & rest', ['tread', 'treadStart', 'stroke', 'strokeGlide', 'flutter', 'sitDownStart', 'doze', 'sleepLying']],
];
const SPEED = { tiptoe: 0.8, walk: 2.6, run: 9.5, push: 1, sidestepLeft: 1, crawl: 0.9, flutter: 1.5, stroke: 1.5 };
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2)); renderer.toneMapping = THREE.AgXToneMapping; renderer.toneMappingExposure = 2.1;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x07060f);
const camera = new THREE.PerspectiveCamera(32, 1, 0.1, 500);
const controls = new OrbitControls(camera, renderer.domElement); controls.enableDamping = true;
const FOG = new THREE.Color(0.016, 0.018, 0.046);
const surface = { uniforms: { tShadow: { value: null }, uShadowM: { value: new THREE.Matrix4() }, uShadowOn: { value: 0 }, uSSize: { value: 1 },
  uMoonOn: { value: 1 }, uMoon: { value: new THREE.Vector3(-0.507, 0.616, 0.604).normalize() }, uMoonCol: { value: new THREE.Vector3(0.16, 0.19, 0.26) },
  uFog: { value: FOG }, uFogD: { value: 1e-7 } } };
const ground = new THREE.Mesh(new THREE.PlaneGeometry(80, 40), new THREE.MeshBasicMaterial({ color: 0x2a2420 }));
ground.rotation.x = -Math.PI / 2; scene.add(ground);
const H = (/#.*set=(\d+)/.exec(location.hash) || [])[1], FU = (/u=([\d.]+)/.exec(location.hash) || [])[1];
const sel = document.getElementById('set'), playEl = document.getElementById('play'), uEl = document.getElementById('u');
SETS.forEach(([n], i) => { const o = document.createElement('option'); o.value = i; o.textContent = n; sel.appendChild(o); });
if (H) sel.value = H; if (FU !== undefined) { playEl.checked = false; uEl.value = FU; }
const chars = [], labels = [];
for (let i = 0; i < 8; i++) {
  const c = createCharacter({ THREE, scene, surface, guests: null, manifest: { range: 32 } });
  c.uniforms.uLightFallback.value.set(0.16, 0.12, 0.1); c.setVisible(true);
  const a = createAnimator(THREE);
  const l = document.createElement('div'); l.className = 'lbl'; document.body.appendChild(l);
  chars.push({ c, a, x: (i - 3.5) * 2.2 }); labels.push(l);
}
function frameCam() { camera.position.set(0, 2.2, 15.5); controls.target.set(0, 0.95, 0); }
frameCam();
const composer = new EffectComposer(renderer); composer.addPass(new RenderPass(scene, camera));
composer.addPass(new UnrealBloomPass(new THREE.Vector2(512, 512), 0.3, 0.4, 1.6)); composer.addPass(new OutputPass());
function resize() { renderer.setSize(innerWidth, innerHeight); composer.setSize(innerWidth, innerHeight); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); }
addEventListener('resize', resize); resize();
let last = performance.now(), t = 0;
const v = new THREE.Vector3();
function loop() {
  requestAnimationFrame(loop);
  const now = performance.now(), dt = Math.min(0.05, (now - last) / 1000); last = now; t += dt;
  const names = SETS[+sel.value][1];
  chars.forEach((k, i) => {
    const name = names[i]; const id = ID[name] ?? 0, len = LEN[id] || 20;
    const u = playEl.checked ? ((t * 30 / len) % 1) : +uEl.value;
    const bones = k.a.update(dt, { id, u }, { speed: SPEED[name] || 0, vy: name === 'fall' || name === 'pound' ? -8 : 0, reduceMotion: false }, { pos: v.set(k.x, 0, 0), yaw: 0.35, pitch: 0, roll: 0 });
    for (let b = 0; b < bones.length; b++) k.c.bones[b].copy(bones[b]);
    k.c.uniforms.uLantern.value.copy(k.a.st.lanternWorld);
    k.c.uniforms.uGround.value.set(k.x, 0, 0);
    const p = v.set(k.x, -0.08, 0).project(camera);
    labels[i].style.left = ((p.x * 0.5 + 0.5) * innerWidth) + 'px'; labels[i].style.top = ((-p.y * 0.5 + 0.5) * innerHeight + 6) + 'px'; labels[i].textContent = name;
  });
  controls.update(); composer.render();
}
loop();
window.__lineup = { SETS, chars, sel };
</script>
</body>
</html>
