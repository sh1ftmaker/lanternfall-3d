<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d0b26">
<meta name="description" content="Fly, explore and walk through Lanternfall, the fictional night-time theme park, in three dimensions.">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='12' fill='%230d0b26'/%3E%3Cpath d='M20 6c-6 0-9 4-9 4v16s3 5 9 5 9-5 9-5V10s-3-4-9-4z' fill='%23ffb547'/%3E%3C/svg%3E">
<title>Lanternfall 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..700;1,9..144,400..600&family=Figtree:wght@400..700&display=swap">
<style>
/* Layout: one full-bleed night scene; a wordmark top-left, a caption card and the controls dock along the bottom. */
:root{
  color-scheme:dark;
  --night:#0d0b26; --ink:#07061a; --paper:#f5ecdc; --muted:#b9b0c9; --amber:#ffb547; --ember:#ff7b5c;
  --glass:rgba(13,11,38,.62); --line:rgba(245,236,220,.16);
  --display:"Fraunces","Iowan Old Style","Palatino Linotype",Georgia,serif;
  --ui:"Figtree",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --land:#ffb547;
}
html,body{height:100%}
body{margin:0;background:var(--ink);color:var(--paper);font-family:var(--ui);font-size:15px;line-height:1.4;overflow:hidden;
  -webkit-tap-highlight-color:transparent;overscroll-behavior:none;user-select:none;-webkit-user-select:none}
#stage{position:fixed;inset:0;touch-action:none}
#stage canvas{display:block;width:100%;height:100%;touch-action:none;outline:none}
.hud{position:fixed;left:0;right:0;pointer-events:none;z-index:5;padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px))}
.hud>*{pointer-events:auto}
.top{top:0;padding-top:calc(env(safe-area-inset-top,0px) + 14px);display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.brand{font-family:var(--display);font-weight:600;font-size:clamp(22px,3.4vw,30px);letter-spacing:.01em;line-height:1;text-shadow:0 2px 18px rgba(7,6,26,.9)}
.brand i{font-style:italic;font-weight:500;color:var(--amber)}
.brand small{display:block;margin-top:6px;font-family:var(--ui);font-weight:500;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.icon-btn{appearance:none;border:1px solid var(--line);background:var(--glass);color:var(--paper);width:42px;height:42px;border-radius:50%;
  display:grid;place-items:center;cursor:pointer;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);font:600 12px var(--ui)}
.icon-btn[aria-pressed="true"]{border-color:var(--amber);color:var(--amber)}
.top-actions{display:flex;gap:8px}
.bottom{bottom:0;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 14px);display:flex;flex-direction:column;gap:10px;align-items:stretch}
.caption{align-self:flex-start;max-width:min(430px,100%);padding:12px 16px 13px;border-left:3px solid var(--land);background:linear-gradient(90deg,var(--glass),rgba(13,11,38,.28));
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-radius:0 12px 12px 0;transition:opacity .5s,transform .5s;pointer-events:none}
.caption.swap{opacity:0;transform:translateY(6px)}
.caption .kicker{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--land);font-weight:600}
.caption h1{margin:3px 0 2px;font-family:var(--display);font-weight:600;font-size:clamp(22px,4.2vw,30px);line-height:1.08;text-wrap:balance}
.caption p{margin:0;color:var(--muted);font-size:14px;max-width:46ch}
.dock{display:flex;gap:10px;align-items:center;min-width:0}
.modes{flex:none;display:flex;padding:4px;gap:2px;border:1px solid var(--line);border-radius:999px;background:var(--glass);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.modes button{appearance:none;border:0;background:transparent;color:var(--muted);font:600 13px var(--ui);padding:9px 14px;border-radius:999px;cursor:pointer;min-height:38px}
.modes button[aria-pressed="true"]{background:var(--amber);color:#2a1a02}
.chips{flex:1;min-width:0;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px 2px;mask-image:linear-gradient(90deg,#000 calc(100% - 28px),transparent)}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;appearance:none;border:1px solid var(--line);background:var(--glass);color:var(--paper);font:500 13px var(--ui);padding:8px 12px;border-radius:999px;cursor:pointer;
  display:flex;align-items:center;gap:7px;min-height:38px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);white-space:nowrap}
.chip::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--c,var(--amber));box-shadow:0 0 8px var(--c,var(--amber))}
.chip[aria-pressed="true"]{border-color:var(--c,var(--amber))}
button:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.hint{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 74px);transform:translateX(-50%);z-index:5;padding:7px 14px;border-radius:999px;background:var(--glass);
  border:1px solid var(--line);font-size:12.5px;color:var(--muted);pointer-events:none;transition:opacity .6s;white-space:nowrap;max-width:calc(100% - 32px);overflow:hidden;text-overflow:ellipsis}
.hint.off{opacity:0}
#stick{position:fixed;z-index:6;width:112px;height:112px;margin:-56px 0 0 -56px;border-radius:50%;border:1px solid var(--line);background:rgba(13,11,38,.35);pointer-events:none}
#stick i{position:absolute;left:50%;top:50%;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;background:rgba(255,181,71,.85)}
#veil{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:radial-gradient(120% 90% at 50% 60%,#1a1647 0%,var(--night) 45%,var(--ink) 100%);transition:opacity 1.2s ease,visibility 1.2s;padding:24px}
#veil.done{opacity:0;visibility:hidden}
.veil-in{width:min(360px,100%);text-align:center}
.veil-in .lamp{width:46px;height:60px;margin:0 auto 18px;border-radius:14px 14px 18px 18px;background:linear-gradient(#ffd68a,var(--amber) 55%,#ff8a3c);box-shadow:0 0 40px rgba(255,181,71,.55),0 0 110px rgba(255,123,92,.35);animation:bob 3.2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-9px) rotate(2deg)}}
.veil-in h2{margin:0;font-family:var(--display);font-weight:600;font-size:38px;letter-spacing:.01em}
.veil-in h2 i{color:var(--amber);font-weight:500}
.veil-in p{margin:8px 0 18px;color:var(--muted)}
.bar{height:4px;border-radius:4px;background:rgba(245,236,220,.14);overflow:hidden}
.bar b{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--ember),var(--amber));border-radius:4px;transition:width .25s}
#veil-msg{margin-top:10px;font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums;min-height:1.4em}
.pill{position:fixed;right:max(16px,env(safe-area-inset-right,0px));top:calc(env(safe-area-inset-top,0px) + 66px);z-index:5;padding:6px 12px;border-radius:999px;background:var(--glass);border:1px solid var(--line);font-size:12px;color:var(--amber);pointer-events:none}
#veil.failed .bar{display:none}
#veil.failed .lamp{animation:none;filter:saturate(.4) brightness(.7)}
#veil.failed #veil-msg{font-size:14px;line-height:1.45}
.retry{appearance:none;margin-top:16px;border:1px solid var(--amber);background:transparent;color:var(--amber);font:600 14px var(--ui);padding:9px 18px;border-radius:999px;cursor:pointer}
.pill.failed{pointer-events:auto;color:var(--paper);display:flex;align-items:center;gap:8px}
.pill .retry{margin:0;padding:4px 10px;font-size:12px}
@media (max-width:640px){
  .dock{flex-direction:column;align-items:stretch;gap:8px}
  .modes{align-self:flex-start}
  .caption p{font-size:13px}
  .brand small{display:none}
}
@media (max-height:460px){ .caption p{display:none} .caption{padding:8px 12px} }
@media (prefers-reduced-motion:reduce){ .veil-in .lamp{animation:none} .caption{transition:none} }
</style>

</head>
<body>
<div id="stage" aria-label="3D view of the Lanternfall park at night"></div>

<div class="hud top">
  <div class="brand">Lantern<i>fall</i><small>The park after dark, in three dimensions</small></div>
  <div class="top-actions">
    <button class="icon-btn" id="btn-hd" type="button" aria-pressed="true" title="Reflections and glow">HD</button>
    <button class="icon-btn" id="btn-full" type="button" title="Fullscreen" aria-label="Fullscreen">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
    </button>
  </div>
</div>

<div class="hint off" id="hint"></div>
<div class="pill" id="loadpill" hidden></div>
<div id="stick" hidden><i></i></div>

<div class="hud bottom">
  <div class="caption" id="caption" aria-live="polite">
    <div class="kicker" id="cap-kicker">Seven lands around a still, black lake</div>
    <h1 id="cap-title">Lanternfall</h1>
    <p id="cap-text">Ten thousand paper lanterns come down onto Stillwater at eleven.</p>
  </div>
  <div class="dock">
    <div class="modes" role="group" aria-label="How to move">
      <button type="button" id="m-tour" aria-pressed="true">Tour</button>
      <button type="button" id="m-orbit" aria-pressed="false">Explore</button>
      <button type="button" id="m-walk" aria-pressed="false">Walk</button>
    </div>
    <div class="chips" id="chips" role="group" aria-label="Places"></div>
  </div>
</div>

<div id="veil">
  <div class="veil-in">
    <div class="lamp" aria-hidden="true"></div>
    <h2>Lantern<i>fall</i></h2>
    <p>Lighting ten thousand lanterns.</p>
    <div class="bar"><b id="bar"></b></div>
    <div id="veil-msg">Opening the gates…</div>
  </div>
</div>

<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/","three/examples/jsm/":"https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/","postprocessing":"./fx/vendor/pp-shim.js"}}
</script>
<script type="module" src="app.js"></script>
</body>
</html>
