<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>WebGL Lights Test</title>
<style>html,body{margin:0;height:100%;background:#05040f;overflow:hidden}canvas{display:block;width:100%;height:100%}
#hud{position:fixed;left:8px;top:8px;color:#f5ecdc;font:12px monospace;background:rgba(0,0,0,.5);padding:4px 6px;white-space:pre}</style>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/"}}
</script></head><body><div id="hud"></div>
<script type="module">
// Classic WebGLRenderer with N forward PointLights (no tiling). Query: K=lights  mat=standard|lambert  cam=walk|aerial  parts=all|...
import * as THREE from 'three';
import { Q, loadPark, loadLights, setCam } from './lights-common.js';
const T = window.__t = { ready: false, errors: [] };
addEventListener('error', (e) => T.errors.push(String(e.message)));
try {
  const K = +(Q.K ?? 32);
  const renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: 'high-performance' });
  renderer.setPixelRatio(devicePixelRatio); renderer.setSize(innerWidth, innerHeight);
  renderer.toneMapping = THREE.AgXToneMapping; renderer.toneMappingExposure = 2.1; renderer.setClearColor(0x05040f);
  renderer.debug.onShaderError = (gl, program, vs, fs) => { T.errors.push('shader: ' + (gl.getProgramInfoLog(program) || '').slice(0, 200) + ' | fs: ' + (gl.getShaderInfoLog(fs) || '').slice(0, 300)); };
  document.body.appendChild(renderer.domElement);
  const gl = renderer.getContext(); T.backend = 'WebGL2-classic';
  T.extra = { maxFragmentUniforms: renderer.capabilities.maxFragmentUniforms, maxVertexUniforms: renderer.capabilities.maxVertexUniforms,
    MAX_FRAGMENT_UNIFORM_VECTORS: gl.getParameter(gl.MAX_FRAGMENT_UNIFORM_VECTORS), MAX_FRAGMENT_UNIFORM_BLOCKS: gl.getParameter(gl.MAX_FRAGMENT_UNIFORM_BLOCKS) };
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(52, innerWidth / innerHeight, 0.6, 5000); setCam(camera, Q.cam || 'walk');
  const opts = { flatShading: true, side: THREE.DoubleSide, vertexColors: true };
  const mat = Q.mat === 'lambert' ? new THREE.MeshLambertMaterial(opts) : new THREE.MeshStandardMaterial({ ...opts, roughness: 0.8, metalness: 0 });
  let t0 = performance.now();
  const { grp, tris } = await loadPark(THREE, mat, Q.parts || 'all', Q.pos || 'u16'); scene.add(grp);
  const { lights, N } = await loadLights(THREE, K); for (const L of lights) scene.add(L);
  scene.add(new THREE.AmbientLight(0x6070a0, 0.08));
  T.loadMs = performance.now() - t0; T.tris = tris; T.K = lights.length; T.N = N;
  const px = new Uint8Array(4); const sync = () => gl.readPixels(0, 0, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, px);
  t0 = performance.now(); renderer.render(scene, camera); T.firstCpuMs = performance.now() - t0; sync(); T.firstMs = performance.now() - t0;
  const prog = renderer.info.programs && renderer.info.programs.find((p) => p.name === mat.type);
  if (prog) { const ok = gl.getProgramParameter(prog.program, gl.LINK_STATUS); T.extra.linkOK = ok; if (!ok) T.failed = true; }
  T.extra.programs = renderer.info.programs.length;
  T.setCam = (n) => setCam(camera, n);
  T.bench = async (n = 40) => { sync(); const t0 = performance.now(); for (let i = 0; i < n; i++) renderer.render(scene, camera); T.lastCpu = (performance.now() - t0) / n; sync(); return (performance.now() - t0) / n; };
  T.snap = async () => { renderer.render(scene, camera); return renderer.domElement.toDataURL('image/jpeg', 0.75); };
  const hud = document.getElementById('hud'); let n = 0, tl = performance.now();
  const loop = () => { if (!T.paused) { renderer.render(scene, camera); if (++n % 30 === 0) { const t = performance.now(); hud.textContent = `classic K=${lights.length} ${((t - tl) / 30).toFixed(1)} ms`; tl = t; } } requestAnimationFrame(loop); };
  requestAnimationFrame(loop); T.ready = true;
} catch (e) { T.errors.push('init: ' + e.message); T.ready = true; T.failed = true; console.error(e); }
</script></body></html>
