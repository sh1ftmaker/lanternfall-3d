<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>WebGPU Lights Test</title>
<style>html,body{margin:0;height:100%;background:#05040f;overflow:hidden}canvas{display:block;width:100%;height:100%}
#hud{position:fixed;left:8px;top:8px;color:#f5ecdc;font:12px monospace;background:rgba(0,0,0,.5);padding:4px 6px;white-space:pre}</style>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.webgpu.js","three/webgpu":"https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.webgpu.js","three/tsl":"https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.tsl.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/"}}
</script></head><body><div id="hud"></div>
<script type="module">
// WebGPURenderer many-light test. Query: backend=webgpu|webgl  lighting=clustered|dynamic|default  K=lights  cam=walk|aerial
// mat=standard|lambert  parts=all|transit,meridian  pos=u16|f32  tile=32  zs=24  perCluster=64  ts=1 (GPU timestamps)  bigtex=1 (16384 tex limit)  flat=1
import * as THREE from 'three/webgpu';
import { attribute, vec3 } from 'three/tsl';
import { ClusteredLighting } from 'three/addons/lighting/ClusteredLighting.js';
import { DynamicLighting } from 'three/addons/lighting/DynamicLighting.js';
import { Q, loadPark, loadLights, setCam } from './lights-common.js';
const T = window.__t = { ready: false, errors: [], log: [] };
addEventListener('error', (e) => T.errors.push(String(e.message)));
addEventListener('unhandledrejection', (e) => T.errors.push('rej: ' + (e.reason && e.reason.message || e.reason)));
try {
  const K = +(Q.K ?? 256), lighting = Q.lighting || 'clustered';
  const renderer = new THREE.WebGPURenderer({ antialias: false, forceWebGL: Q.backend === 'webgl', trackTimestamp: !!Q.ts, ...(Q.bigtex ? { requiredLimits: { maxTextureDimension2D: 16384 } } : {}), powerPreference: 'high-performance' });
  renderer.setPixelRatio(devicePixelRatio); renderer.setSize(innerWidth, innerHeight);
  renderer.toneMapping = THREE.AgXToneMapping; renderer.toneMappingExposure = 2.1; renderer.setClearColor(0x05040f);
  if (lighting === 'clustered') renderer.lighting = new ClusteredLighting(Math.max(K, 1), +(Q.tile || 32), +(Q.zs || 24), +(Q.perCluster || 64));
  else if (lighting === 'dynamic') renderer.lighting = new DynamicLighting({ maxPointLights: Math.max(K, 1) });
  document.body.appendChild(renderer.domElement);
  await renderer.init();
  T.backend = renderer.backend.isWebGPUBackend ? 'WebGPU' : 'WebGL2';
  if (renderer.backend.device) { T.limits = { maxTextureDimension2D: renderer.backend.device.limits.maxTextureDimension2D, maxStorageBufferBindingSize: renderer.backend.device.limits.maxStorageBufferBindingSize };
    renderer.backend.device.addEventListener('uncapturederror', (e) => T.errors.push('gpu: ' + e.error.message.slice(0, 300))); }
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(52, innerWidth / innerHeight, 0.6, 5000); setCam(camera, Q.cam || 'walk');
  const mat = Q.mat === 'lambert' ? new THREE.MeshLambertNodeMaterial({ flatShading: true, side: THREE.DoubleSide })
    : new THREE.MeshStandardNodeMaterial({ flatShading: true, side: THREE.DoubleSide, roughness: 0.8, metalness: 0 });
  mat.colorNode = Q.flat ? vec3(0.5) : attribute('color').rgb;
  let t0 = performance.now();
  const { grp, tris } = await loadPark(THREE, mat, Q.parts || 'all', Q.pos || 'u16'); scene.add(grp);
  const { lights, N } = await loadLights(THREE, K); for (const L of lights) scene.add(L);
  scene.add(new THREE.AmbientLight(0x6070a0, 0.08));
  T.loadMs = performance.now() - t0; T.tris = tris; T.K = lights.length; T.N = N;
  t0 = performance.now(); renderer.render(scene, camera); T.firstCpuMs = performance.now() - t0;
  if (renderer.backend.device) await renderer.backend.device.queue.onSubmittedWorkDone();
  else { const gl = renderer.backend.gl; gl.readPixels(0, 0, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, new Uint8Array(4)); }
  T.firstMs = performance.now() - t0;
  T.setCam = (n) => { setCam(camera, n); };
  // headless Chrome with software compositing cannot show/read back WebGPU canvases, so the check shot renders into a
  // half-float target, reads it back and tone-maps (Reinhard-ish * exposure + sRGB) in JS.
  T.snap = async () => { const w = (renderer.domElement.width >> 1) & ~63, h = renderer.domElement.height >> 1;   // width multiple of 64 avoids row padding
    const rt = new THREE.RenderTarget(w, h, { type: THREE.HalfFloatType }); renderer.setRenderTarget(rt); renderer.render(scene, camera); renderer.setRenderTarget(null);
    const px = await renderer.readRenderTargetPixelsAsync(rt, 0, 0, w, h); rt.dispose();
    const c = document.createElement('canvas'); c.width = w; c.height = h; const cx = c.getContext('2d'), im = cx.createImageData(w, h);
    const flip = !renderer.backend.isWebGPUBackend, rowLen = Math.floor(px.length / h / 4);   // WebGL rows bottom-up; WebGPU rows padded to 256 B
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) { const si = ((flip ? h - 1 - y : y) * rowLen + x) * 4, di = (y * w + x) * 4;
      for (let k = 0; k < 3; k++) { let v = THREE.DataUtils.fromHalfFloat(px[si + k]) * 2.1; v = v / (1 + v); im.data[di + k] = 255 * (v <= 0.0031308 ? 12.92 * v : 1.055 * Math.pow(v, 1 / 2.4) - 0.055); } im.data[di + 3] = 255; }
    cx.putImageData(im, 0, 0); return c.toDataURL('image/jpeg', 0.75); };
  // throughput: n renders back-to-back in one task, then one GPU sync; ms per frame (independent of canvas compositing)
  const sync = async () => { if (renderer.backend.device) await renderer.backend.device.queue.onSubmittedWorkDone();
    else { const gl = renderer.backend.gl; gl.readPixels(0, 0, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, new Uint8Array(4)); } };
  T.bench = async (n = 40) => { await sync(); const t0 = performance.now(); for (let i = 0; i < n; i++) renderer.render(scene, camera); T.lastCpu = (performance.now() - t0) / n; await sync(); return (performance.now() - t0) / n; };
  T.bench1 = async (n = 10) => { const r = []; for (let i = 0; i < n; i++) { const t0 = performance.now(); renderer.render(scene, camera); await sync(); r.push(performance.now() - t0); } return r.map((x) => +x.toFixed(2)); };
  T.gpuTs = async (n = 20) => { const r = []; for (let i = 0; i < n; i++) { renderer.render(scene, camera); await sync(); await renderer.resolveTimestampsAsync(THREE.TimestampQuery.RENDER); await renderer.resolveTimestampsAsync(THREE.TimestampQuery.COMPUTE); r.push([renderer.info.render.timestamp, renderer.info.compute.timestamp]); } return r; };
  T.renderer = renderer; T.scene = scene; T.camera = camera;
  const hud = document.getElementById('hud'); let n = 0, tl = performance.now();
  const loop = () => { if (T.paused) { requestAnimationFrame(loop); return; } renderer.render(scene, camera); if (++n % 30 === 0) { const t = performance.now(); hud.textContent = `${T.backend} ${lighting} K=${lights.length} ${((t - tl) / 30).toFixed(1)} ms`; tl = t; } requestAnimationFrame(loop); };
  requestAnimationFrame(loop); T.ready = true;
} catch (e) { T.errors.push('init: ' + e.message); T.ready = true; T.failed = true; console.error(e); }
</script></body></html>
