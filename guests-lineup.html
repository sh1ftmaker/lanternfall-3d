<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Guest Line-up</title>
<style>
  :root { --bg: #07060f; --fg: #efe6d6; --muted: #a59c8f; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font: 13px/1.4 system-ui, sans-serif; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; }
  #ui { position: fixed; left: 12px; top: 12px; background: rgba(10, 9, 20, 0.78); padding: 10px 12px; border-radius: 10px; max-width: calc(100vw - 48px); }
  #ui b { font-weight: 600; } #ui label { margin-right: 10px; white-space: nowrap; } #ui .m { color: var(--muted); }
</style>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/"}}
</script>
</head>
<body>
<div id="ui"><b>Park guests: line-up</b> <span class="m">rows: walk, idle, photo, wave/point, sit, lean · columns: body types · drag to orbit</span><br>
  <label><input type="radio" name="l" value="warm" checked> lantern light</label>
  <label><input type="radio" name="l" value="lawn"> lawn (dim)</label>
  <label><input type="radio" name="l" value="neon"> neon</label>
  <label><input type="checkbox" id="spin" checked> turntable</label>
  <label><input type="checkbox" id="items"> carried items</label>
  <label>palette <input type="range" id="pal" min="0" max="40" value="0"></label>
</div>
<script type="module">
// Inspect the guest figures alone: every body type (columns) in every animation (rows), under three kinds of light.
// Hash: #lod1 draws the cheap mesh, #imp the impostor cards; #seed=N picks another palette set.
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { createGuests } from './fx/guests/render.js';
import { KINDS } from './fx/guests/assets.js';

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2)); renderer.toneMapping = THREE.AgXToneMapping; renderer.toneMappingExposure = 2.1;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x05040f);
const camera = new THREE.PerspectiveCamera(40, 1, 0.1, 500);
camera.position.set(4.5, 2.6, 7.5);
const controls = new OrbitControls(camera, renderer.domElement); controls.target.set(4.5, 0.8, -3.6); controls.enableDamping = true;
const uTime = { value: 0 };
const FOG = new THREE.Color(0.016, 0.018, 0.046);
const surface = { uniforms: { tShadow: { value: null }, uShadowM: { value: new THREE.Matrix4() }, uShadowOn: { value: 0 }, uSSize: { value: 1 },
  uMoonOn: { value: 1 }, uMoon: { value: new THREE.Vector3(-0.507, 0.616, 0.604).normalize() }, uMoonCol: { value: new THREE.Vector3(0.11, 0.13, 0.176) },
  uFog: { value: FOG }, uFogD: { value: 2.4e-7 } } };
const manifest = { range: 32, lake: [], water_z: -10 };
// ground: dark paving lit like the light setting
const ground = new THREE.Mesh(new THREE.PlaneGeometry(60, 40), new THREE.MeshBasicMaterial({ color: 0x222222 }));
ground.rotation.x = -Math.PI / 2; ground.position.set(4.5, 0, -3); scene.add(ground);

// line-up crowd: anim rows x body-type columns (Blender frame: x east, y north; three z = -y)
const ANIMS = [0, 1, 2, 3, 4, 5], cols = KINDS.length;
const hashSeed = +((/seed=(\d+)/.exec(location.hash) || [])[1] || 0);
const N = ANIMS.length * cols, state = new Float32Array(N * 8);
const crowd = { count: N, state, update() {} };
function seedFor(kind, row, pal, items) {
  // search a seed whose look has this body type (guestLook is deterministic): try a sequence
  return { kind, row, pal, items };
}
import('./fx/guests/assets.js').then(({ guestLook }) => {
  const pick = (kind, salt, wantItem) => {
    for (let k = 0; k < 20000; k++) { const sd = (k * 0.6180339887 + salt * 0.0137) % 1; const L = guestLook(sd); if (L.kind === kind && (L.item !== 0) === wantItem) return { s: sd, L }; }
    return { s: 0.5 };
  };
  window.relayout = () => {
    const pal = +document.querySelector('#pal').value + hashSeed, items = document.querySelector('#items').checked;
    for (let r = 0; r < ANIMS.length; r++) for (let c = 0; c < cols; c++) {
      const i = r * cols + c, o = i * 8;
      const got = pick(c, pal * 50 + r * 9 + c, items);
      state[o] = c * 1.3; state[o + 1] = r * 1.6; state[o + 2] = ANIMS[r] === 4 ? 0.45 : 0; state[o + 3] = -Math.PI / 2;
      state[o + 4] = ANIMS[r] === 0 ? 1.25 : 0; state[o + 5] = ANIMS[r]; state[o + 7] = got.s;
    }
  };
  relayout();
  for (const id of ['#pal', '#items']) document.querySelector(id).addEventListener('input', relayout);
});
// benches and rails for the sit / lean rows
const benchMat = new THREE.MeshBasicMaterial({ color: 0x2a1c12 });
for (let c = 0; c < cols; c++) {
  const b = new THREE.Mesh(new THREE.BoxGeometry(0.9, 0.06, 0.45), benchMat); b.position.set(c * 1.3, 0.42, -4 * 1.6 + 0.05); scene.add(b);
}
const rail = new THREE.Mesh(new THREE.BoxGeometry(cols * 1.3, 0.06, 0.08), benchMat); rail.position.set((cols - 1) * 0.65, 1.08, -5 * 1.6 + 0.42); scene.add(rail);

const lod = /lod1/.test(location.hash) ? 1 : /imp/.test(location.hash) ? 2 : 0;
const guests = createGuests({ THREE, scene, crowd, uTime, Q: { guests: { lod0Px: lod === 0 ? 0 : 1e9, lod1Px: lod === 1 ? 0 : 1e9, impPx: 0 } }, manifest, DATA: './no-data/', fetchBin: async () => new Uint8Array(0), surface, mobile: false, renderer, camera });
const LIGHTS = { warm: [0.30, 0.17, 0.08, 0x3a2a1c], lawn: [0.035, 0.045, 0.05, 0x0d1210], neon: [0.12, 0.08, 0.22, 0x1a1530] };
function setLight(k) { const L = LIGHTS[k]; guests.uniforms.uLightFallback.value.set(L[0], L[1], L[2]); ground.material.color.setHex(L[3]); }
setLight('warm');
for (const r of document.querySelectorAll('input[name=l]')) r.addEventListener('change', () => setLight(r.value));
const composer = new EffectComposer(renderer, new THREE.WebGLRenderTarget(1, 1, { type: THREE.HalfFloatType, samples: 4 }));
composer.addPass(new RenderPass(scene, camera)); composer.addPass(new UnrealBloomPass(new THREE.Vector2(256, 256), 0.1, 0.35, 1.8)); composer.addPass(new OutputPass());
function resize() { const w = innerWidth, h = innerHeight; renderer.setSize(w, h); composer.setSize(w, h); camera.aspect = w / h; camera.updateProjectionMatrix(); }
addEventListener('resize', resize); resize();
let last = performance.now(), yaw = -Math.PI / 2;
function frame() {
  requestAnimationFrame(frame);
  const now = performance.now(), dt = Math.min(0.1, (now - last) / 1000); last = now; uTime.value += dt;
  if (document.querySelector('#spin').checked) yaw += dt * 0.5;
  for (let i = 0; i < N; i++) { state[i * 8 + 3] = yaw; if (state[i * 8 + 5] === 0) state[i * 8 + 6] += dt * 1.25 / 1.4; }
  controls.update(); camera.updateMatrixWorld();
  guests.update(camera, dt); composer.render(dt);
}
frame();
window.__lineup = { guests, camera, controls, setLight, state, get yaw() { return yaw; }, set yaw(v) { yaw = v; } };
</script>
</body>
</html>
